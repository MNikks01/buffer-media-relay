# Local MongoDB + S3 (RustFS) for development and the integration tests.
# MinIO stopped publishing community images in Oct 2025; RustFS is a maintained,
# S3-compatible replacement with bucket policies and presigned URLs.
services:
  mongo:
    image: mongo:7.0
    ports: ["27017:27017"]
  s3:
    image: rustfs/rustfs:1.0.4
    ports: ["9000:9000"]
    environment:
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_VOLUMES: /data
